name: Dependency Submission

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # pin@v5
        with:
          distribution: 'temurin'
          java-version: 8
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4
        with:
          dependency-graph-include-projects: ':newrelic-security-(agent|api)'
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

  dependency-review:
    needs: dependency-submission # Wait for graph submission to finish
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: 'low' # Fails the action if CVE is found
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300